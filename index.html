<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <div class="blue">
           <div class="profile-image">
               <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLCXJH-0aEDWxPkoDTN08BaDwyeDMOKrchRUqP6tgEHg&s=10" alt="pooh krittin">
           </div>
        </div>
        <div class="white">
             <div class="info">
                <h1>CodingVally</h1>
                <p>YouTube & Blogger</p>
             </div>
             <div class="logos">
                <i class="fa-brands fa-youtube"></i>
                 <i class="fa-brands fa-instagram"></i>
                 <i class="fa-brands fa-facebook"></i>
                 <i class="fa-brands fa-twitter"></i>
             </div>
             <div class="buttons">
                <button id="one">Subscribe</button>
                <button id="two">Message</button>
             </div>
             <div class="other">
                <i class="fa-solid fa-thumbs-up"> 60k </i>
                <i class="fa-solid fa-share"> 12k </i>
                <i class="fa-solid fa-comment"> 5k </i>
             </div>
        </div>
    </div>
    
</body>
</html>
